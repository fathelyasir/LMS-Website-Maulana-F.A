name: Deploy Kelasku to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore source entry for Vite
        run: cp index.template.html index.html

      - name: Build application
        run: npm run build

      - name: Include landing page and static portraits
        run: |
          cp landing.html dist/landing.html
          cp assets/logo-kelasku.png dist/assets/logo-kelasku.png
          cp assets/habibie.jpg dist/assets/habibie.jpg
          cp assets/ki-hajar.jpg dist/assets/ki-hajar.jpg
          cp assets/kartini.jpg dist/assets/kartini.jpg
          cp assets/buya-hamka.jpg dist/assets/buya-hamka.jpg

      - name: Publish build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
